name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'true'

  pages:
    if: github.ref == 'refs/heads/master'
    needs: ci
    uses: ./.github/workflows/deploy-manifest.yml
    with:
      org: wow-look-at-my
      deploy-pages: true
