name: Deploy GitHub Pages

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build wow binary
        uses: wow-look-at-my/go-toolchain@v1
        with:
          os: linux
          arch: amd64
          autorelease: 'false'
          upload-artifacts: 'false'

      - name: Build encrypted manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Skip when recipients.json has no entries — the manifest can't be
          # encrypted to nobody, but the rest of pages should still deploy.
          count=$(jq '.recipients | length' recipients.json)
          if [ "$count" -gt 0 ]; then
            ./build/wow-cli_linux_amd64 build-manifest --output pages/manifest.json.age
            echo "Published manifest to $count recipients."
          else
            echo "recipients.json has 0 entries — skipping manifest publish."
          fi

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
      - uses: actions/deploy-pages@v4
        id: deployment
