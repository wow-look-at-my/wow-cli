name: Deploy GitHub Pages

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WOW_MANIFEST_RECIPIENT: ${{ secrets.WOW_MANIFEST_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Build wow binary
        if: env.WOW_MANIFEST_RECIPIENT != ''
        uses: wow-look-at-my/go-toolchain@v1
        with:
          os: linux
          arch: amd64
          autorelease: 'false'
          upload-artifacts: 'false'

      - name: Build encrypted manifest
        if: env.WOW_MANIFEST_RECIPIENT != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./build/wow-cli_linux_amd64 build-manifest --output pages/manifest.json.age

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
      - uses: actions/deploy-pages@v4
        id: deployment
