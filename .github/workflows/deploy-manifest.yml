name: Deploy Manifest

on:
  workflow_call:
    inputs:
      org:
        required: true
        type: string
      include:
        description: 'Space-separated glob patterns for repo names to include (omit for all)'
        required: false
        type: string
        default: ''
      deploy-pages:
        required: false
        type: boolean
        default: false

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment: ${{ inputs.deploy-pages && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wow
        id: wow
        uses: wow-look-at-my/actions/download-release-binary@v1
        with:
          repo: wow-look-at-my/wow-cli
          name: wow-cli
          token: ${{ github.token }}

      - name: Build encrypted manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(build-manifest --org "${{ inputs.org }}" --output pages/manifest.json.age --skip-if-empty)
          for pattern in ${{ inputs.include }}; do
            args+=(--include "$pattern")
          done
          ${{ steps.wow.outputs.path }} "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: hashFiles('pages/manifest.json.age') != ''
        with:
          name: manifest
          path: pages/manifest.json.age

      - if: inputs.deploy-pages && hashFiles('pages/manifest.json.age') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
      - if: inputs.deploy-pages && hashFiles('pages/manifest.json.age') != ''
        uses: actions/deploy-pages@v4
        id: deployment
